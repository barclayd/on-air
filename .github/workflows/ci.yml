name: Build and package checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test release validation and failure handling
        run: python3 -m unittest discover -s Tools/ReleaseTests -v
      - name: Check audio, credentials, and clipboard preservation
        run: Tools/test-core.sh
      - name: Build universal app and exercise DMG packaging without credentials
        run: python3 Tools/release.py package --tag v0.0.0-alpha.1 --build 1 --unsigned
      - name: Retain packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-packaging-check
          path: |
            .build/release/logs/
            .build/release/dist/
          if-no-files-found: ignore
          retention-days: 7
